<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Notas - Rediseño UX</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Mis Notas</h1>
    <div id="notificacion" class="notificacion" role="status" aria-live="polite"></div>
    <form id="form-nota" class="formulario" novalidate>
      <label for="texto-nota">Escribe una nueva nota:</label>
      <div class="input-grupo">
        <input 
          type="text" 
          id="texto-nota" 
          placeholder="Ej. Comprar materiales para el taller" 
          aria-describedby="error-nota"
          required
        >
        <button type="submit" id="btn-agregar">Agregar Nota</button>
      </div>
      <span id="error-nota" class="mensaje-error"></span>
    </form>
    <section class="seccion-notas">
      <h2>Listado de Notas</h2>
      <ul id="lista-notas" class="lista-notas"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
